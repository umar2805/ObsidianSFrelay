<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — Finders</title>
<meta name="theme-color" content="#EDEFEA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   RELAY — leads pass from the person who finds them to the
   person who calls them.

   Two sides, two colours. Finders are indigo, closers are
   green. That is the only place colour carries meaning, so if
   something on screen is coloured it tells you whose hands the
   lead is in.
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;

  --ground:#EDEFEA;
  --sheet:#FBFCFA;
  --sheet-2:#F4F6F1;
  --line:#DDE1D8;
  --line-2:#C9CFC2;

  --ink:#191D19;
  --ink-2:#5A6157;
  --ink-3:#848B80;

  --finder:#2B3F94;
  --finder-wash:#EAEDF8;
  --closer:#0C6446;
  --closer-wash:#E6F0EA;

  --amber:#8A5A06;
  --amber-wash:#F7EFE0;
  --red:#A63A2E;
  --red-wash:#F8EBE8;

  --r:10px;
  --shadow:0 1px 2px rgba(25,29,25,.05), 0 6px 18px rgba(25,29,25,.07);
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}

/* ───── shell ───── */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(90% 60% at 50% -10%, rgba(43,63,148,.05), transparent 70%);
}
body.c-role::before{background:radial-gradient(90% 60% at 50% -10%, rgba(12,100,70,.05), transparent 70%);}

.bar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  height:60px;padding:0 22px;
  background:rgba(237,239,234,.82);backdrop-filter:blur(14px) saturate(170%);
  border-bottom:1px solid var(--line);
}
.mark{
  display:flex;align-items:baseline;gap:9px;
  font-weight:700;letter-spacing:-.03em;font-size:17px;
}
.mark i{
  font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--finder);
}
body.c-role .mark i{color:var(--closer)}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.who{
  display:flex;align-items:center;gap:8px;min-width:0;
  font-size:12.5px;font-weight:600;letter-spacing:.055em;
  padding:6px 12px;border-radius:999px;
  background:var(--finder-wash);color:var(--finder);
}
body.c-role .who{background:var(--closer-wash);color:var(--closer)}
.who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:currentColor}
.dot.f,.dot.c{background:currentColor}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:36px 22px 120px}
@media (max-width:600px){
  .bar{padding:0 15px;height:56px;gap:10px}
  .mark i{display:none}
  .wrap{padding:24px 15px 110px}
}

/* ───── buttons ───── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 17px;border-radius:var(--r);font-weight:600;font-size:14px;
  border:1px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s,transform .08s;
}
.btn:active{transform:scale(.99)}
.btn.solid{background:var(--ink);color:var(--sheet)}
.btn.solid:hover{background:#2C332C}
.btn.f{background:var(--finder);color:#fff}
.btn.f:hover{background:#25357D}
.btn.c{background:var(--closer);color:#fff}
.btn.c:hover{background:#0A5439}
.btn.quiet{background:var(--sheet);border-color:var(--line-2);color:var(--ink)}
.btn.quiet:hover{border-color:var(--ink-2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.wide{width:100%;padding:14px 18px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--ink-2);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:4px}
.link:hover{color:var(--ink)}

/* ───── fields ───── */
label.lab{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--ink-2)}
.opt{font-weight:400;color:var(--ink-3)}
input[type=text],input[type=tel],textarea{
  width:100%;background:var(--sheet);border:1px solid var(--line-2);
  border-radius:var(--r);padding:12px 14px;
  transition:border-color .12s,box-shadow .12s;
}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(25,29,25,.09)}
input:disabled,textarea:disabled{background:var(--sheet-2);color:var(--ink-3)}
textarea{resize:vertical;min-height:80px;line-height:1.55}
.field{margin-bottom:14px}
.err{color:var(--red);font-size:13px;margin:7px 0 0;font-weight:500}

/* ───── gate ───── */
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  max-width:520px;margin:0 auto;padding:40px 20px}
.gate h1{font-size:34px;font-weight:700;letter-spacing:-.035em;margin:0 0 8px;line-height:1.1}
.gate p.sub{color:var(--ink-2);margin:0 0 28px;max-width:44ch}
.roles{display:grid;gap:12px}
.role{
  text-align:left;background:var(--sheet);border:1px solid var(--line-2);
  border-radius:14px;padding:20px;display:flex;gap:16px;align-items:flex-start;
  transition:border-color .14s,box-shadow .14s;
}
.role:hover{border-color:var(--ink);box-shadow:var(--shadow)}
.role .glyph{
  width:40px;height:40px;border-radius:10px;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
}
.role.f .glyph{background:var(--finder-wash);color:var(--finder)}
.role.c .glyph{background:var(--closer-wash);color:var(--closer)}
.role b{display:block;font-size:17px;font-weight:600;letter-spacing:-.015em}
.role small{display:block;color:var(--ink-2);font-size:13.5px;margin-top:3px;line-height:1.45}
.gate .back{margin-bottom:20px;align-self:flex-start}

/* ───── the door ─────
   Two panels: a coloured face carrying the board's live number, and
   a quiet side for your name. The colour tells you which entrance
   you came through before you've read a word. */
.door{display:grid;grid-template-columns:1.06fr 1fr;min-height:100dvh}
.door-face{
  position:relative;display:flex;align-items:center;padding:56px;overflow:hidden;
  background:var(--finder);color:#fff;
}
.door-face.c{background:var(--closer)}
/* one soft light source, top-left, so the panel has depth without decoration */
.door-face::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 8% 0%, rgba(255,255,255,.16), rgba(255,255,255,0) 62%);
}
.door-face-in{position:relative;z-index:1;width:100%;max-width:420px}
.door-mark{
  font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  opacity:.6;margin-bottom:auto;
}
.door-live{display:block;margin:52px 0 0}
.door-n{
  display:block;font-size:clamp(76px,9vw,128px);font-weight:700;
  letter-spacing:-.055em;line-height:.88;
  font-variant-numeric:tabular-nums;
  animation:doorIn .5s cubic-bezier(.2,.8,.3,1) both;
}
.door-n.is-line{font-size:clamp(30px,3.4vw,44px);letter-spacing:-.03em;line-height:1.14;max-width:11ch}
.door-cap{display:block;font-size:17px;line-height:1.4;opacity:.82;margin-top:14px;max-width:22ch}
.door-foot{
  margin:44px 0 0;font-size:13.5px;line-height:1.55;opacity:.58;max-width:30ch;
  border-top:1px solid rgba(255,255,255,.22);padding-top:16px;
}
@keyframes doorIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.door-form{display:flex;align-items:center;padding:56px;background:var(--ground)}
.door-form-in{width:100%;max-width:370px}
.door-greet{margin:0 0 6px;font-size:14px;color:var(--ink-3);font-weight:500}
.door-h{font-size:32px;font-weight:700;letter-spacing:-.035em;margin:0 0 8px;line-height:1.12}
.door-form .sub{color:var(--ink-2);margin:0 0 24px;max-width:36ch;font-size:14.5px}
.door-form .field{margin-bottom:12px}
.door-form input{padding:14px 16px;font-size:16px}
#userInput{letter-spacing:.09em;font-weight:600;text-transform:uppercase}
.door-form .back{margin:0 0 26px;display:inline-block}

@media (max-width:860px){
  .door{grid-template-columns:1fr;min-height:100dvh}
  .door-face{padding:32px 26px 34px;align-items:flex-start;min-height:auto}
  .door-face-in{max-width:none}
  .door-mark{margin-bottom:26px}
  .door-live{margin-top:0}
  .door-n{font-size:clamp(62px,19vw,92px)}
  .door-cap{font-size:15.5px;max-width:26ch}
  .door-foot{display:none}
  .door-form{padding:30px 26px 46px;align-items:flex-start}
  .door-form-in{max-width:none}
  .door-h{font-size:26px}
}

/* ───── masthead ─────
   The number is the board's pulse, so it gets the weight and a rule
   under it; the supporting counts sit beside it, not inside a sentence. */
.headline{margin:0 0 30px}
.headline .n{
  display:block;font-size:clamp(60px,9vw,88px);font-weight:700;
  letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums;
}
.headline .n.c{color:var(--closer)}
.headline .n.f{color:var(--finder)}
.headline .cap{
  display:block;font-size:15.5px;color:var(--ink-2);margin-top:12px;
  padding-bottom:18px;border-bottom:1px solid var(--line);max-width:34ch;
}
.side{display:flex;gap:0;margin-top:14px;flex-wrap:wrap}
.side div{padding:0 20px;border-left:1px solid var(--line)}
.side div:first-child{padding-left:0;border-left:none}
.side b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.side small{
  display:block;font-size:10px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);margin-top:4px;
}
@media (max-width:600px){
  .headline{margin-bottom:24px}
  .headline .cap{font-size:14.5px;padding-bottom:15px}
  .side div{padding:0 14px}
}

/* ───── tabs ───── */
.tabs{
  display:inline-flex;gap:3px;padding:4px;margin-bottom:22px;
  background:var(--sheet-2);border:1px solid var(--line);border-radius:11px;
  max-width:100%;overflow-x:auto;
}
.tab{
  padding:8px 14px;border-radius:8px;
  font-size:13.5px;font-weight:600;color:var(--ink-2);
  white-space:nowrap;flex:none;
  transition:background .14s,color .14s,box-shadow .14s;
}
.tab b{
  display:inline-block;margin-left:7px;font-weight:600;font-size:11px;
  padding:1px 6px;border-radius:5px;background:rgba(25,29,25,.07);color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.tab.on b{background:var(--finder);color:#fff}
body.c-role .tab.on b{background:var(--closer)}

/* ───── cards ───── */
.card{
  background:var(--sheet);border:1px solid var(--line);border-radius:16px;
  padding:26px;margin-bottom:16px;box-shadow:var(--shadow);
}
.card h2{margin:0 0 5px;font-size:20px;font-weight:700;letter-spacing:-.025em}
.card p.note{margin:0 0 22px;color:var(--ink-2);font-size:13.5px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.card .field{margin-bottom:16px}
.card input{padding:13px 15px;font-size:15px}
@media (max-width:600px){.card{padding:20px}}

/* ───── leads ─────
   Name first, number second — those are the two things a caller
   needs. Everything else is provenance and sits in the footer. */
.list{display:grid;gap:12px}
.lead{
  background:var(--sheet);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px 16px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
  transition:border-color .14s,box-shadow .14s;
}
.lead:hover{border-color:var(--line-2)}
.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-2)}
.lead.s-claimed::before{background:var(--closer)}
.lead.s-call_back::before{background:var(--amber)}
.lead.s-interested::before{background:var(--closer)}
.lead.s-sold::before{background:var(--closer);width:5px}
.lead.s-declined::before{background:var(--red)}

.lead-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.lead-title{flex:1;min-width:0}
.lead-name{font-size:18px;font-weight:700;letter-spacing:-.022em;line-height:1.2;word-break:break-word}
.lead-where{font-size:13px;color:var(--ink-2);margin-top:4px;word-break:break-word}

.lead-tel{
  display:inline-flex;align-items:center;gap:9px;
  font-size:15.5px;font-weight:600;letter-spacing:.01em;
  color:var(--ink);text-decoration:none;
  padding:9px 15px;border-radius:9px;
  background:var(--sheet-2);border:1px solid var(--line);
  transition:border-color .14s,background .14s;
}
.lead-tel::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--closer);flex:none}
.lead-tel:hover{border-color:var(--closer);background:var(--closer-wash)}

.lead-foot{
  display:flex;flex-wrap:wrap;gap:3px 12px;
  margin-top:16px;padding-top:13px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);
}
.lead-foot b{font-weight:600;color:var(--ink-2);letter-spacing:.04em}

.pin{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--sheet-2);color:var(--ink-2);
}
.pin::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.pin.claimed,.pin.interested{background:var(--closer-wash);border-color:transparent;color:var(--closer)}
.pin.sold{background:var(--closer);border-color:var(--closer);color:#fff}
.pin.call_back{background:var(--amber-wash);border-color:transparent;color:var(--amber)}
.pin.declined{background:var(--red-wash);border-color:transparent;color:var(--red)}
.lead-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ───── thread ───── */
.thread{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.msg{font-size:13.5px;line-height:1.5}
.msg .from{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.msg .from.f{color:var(--finder)}
.msg .from.c{color:var(--closer)}
.msg .when{font-weight:400;color:var(--ink-3);font-size:12px}
.msg .txt{color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.say{display:flex;gap:8px;margin-top:12px;align-items:flex-start}
.say textarea{min-height:44px;padding:11px 13px}

/* ───── outcomes ───── */
.outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
.oc{padding:11px 10px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--sheet);font-size:13.5px;font-weight:600;text-align:center;
  transition:border-color .12s,background .12s,color .12s}
.oc:hover{border-color:var(--ink)}
.oc.good:hover{background:var(--closer-wash);border-color:var(--closer);color:var(--closer)}
.oc.warn:hover{background:var(--amber-wash);border-color:var(--amber);color:var(--amber)}
.oc.bad:hover{background:var(--red-wash);border-color:var(--red);color:var(--red)}
.oc.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* ───── empty + skeleton ───── */
.empty{
  text-align:center;padding:64px 24px;background:var(--sheet);
  border:1px solid var(--line);border-radius:16px;color:var(--ink-2);
  font-size:14px;line-height:1.6;box-shadow:var(--shadow);
}
.empty b{
  display:block;color:var(--ink);font-size:18px;font-weight:700;
  margin-bottom:8px;letter-spacing:-.02em;
}
.empty p{margin:0 auto;max-width:36ch}
.empty .ring{
  width:34px;height:34px;border-radius:50%;margin:0 auto 18px;
  border:1.5px dashed var(--line-2);
}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk{display:block;border-radius:6px;
  background:linear-gradient(90deg,rgba(25,29,25,.05) 25%,rgba(25,29,25,.10) 37%,rgba(25,29,25,.05) 63%);
  background-size:400% 100%;animation:shim 1.4s ease infinite}
.sk-lead{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}

/* ───── toast ───── */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--sheet);padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:500;box-shadow:0 8px 28px rgba(25,29,25,.3);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:90;
  max-width:88vw;text-align:center;
}
.toast.up{opacity:1;transform:translateX(-50%) translateY(0)}

/* ───── dupe warning ───── */
.warn-box{background:var(--amber-wash);border:1px solid rgba(138,90,6,.25);
  border-radius:12px;padding:14px 16px;margin-bottom:14px}
.warn-box b{display:block;font-size:14px;margin-bottom:4px;color:var(--amber)}
.warn-box p{margin:0;font-size:13.5px;color:var(--ink-2)}

.setup{max-width:560px;margin:60px auto;padding:26px;background:var(--sheet);
  border:1px solid var(--line-2);border-radius:14px}
.setup h2{margin:0 0 10px;font-size:20px}
.setup p{color:var(--ink-2);font-size:14px}
.setup code{background:var(--sheet-2);padding:2px 6px;border-radius:5px;font-size:13px}
</style>
</head>
<body>


<!-- ══════ THE DOOR ══════ -->
<section class="door hidden" id="whoami">
  <div class="door-face" id="doorFace">
    <div class="door-face-in">
      <div class="door-mark">Relay</div>
      <div class="door-live">
        <span class="door-n" id="doorN">&nbsp;</span>
        <span class="door-cap" id="doorCap">&nbsp;</span>
      </div>
      <p class="door-foot" id="doorFoot"></p>
    </div>
  </div>
  <div class="door-form">
    <div class="door-form-in">
      <button class="link back hidden" id="whoamiBack">Back</button>
      <p class="door-greet" id="doorGreet"></p>
      <h1 class="door-h" id="doorH">Sign in</h1>
      <p class="sub" id="whoamiSub"></p>

      <div id="signinFields">
        <div class="field">
          <label class="lab" for="userInput">Employee ID</label>
          <input type="text" id="userInput" autocomplete="username" autocapitalize="characters"
                 spellcheck="false" placeholder="SF001" maxlength="12">
        </div>
        <div class="field">
          <label class="lab" for="pwInput">Password</label>
          <input type="password" id="pwInput" autocomplete="current-password" placeholder="••••••••">
        </div>
      </div>

      <p class="err hidden" id="whoamiErr"></p>
      <button class="btn wide" id="doWhoami">Sign in</button>
    </div>
  </div>
</section>

<!-- ══════ APP ══════ -->
<div class="hidden" id="app">
  <header class="bar">
    <div class="mark" id="mark">Relay</div>
    <div class="bar-right">
      <div class="who" id="who"></div>
      <button class="link" id="leave">Sign out</button>
    </div>
  </header>
  <main class="wrap">
    <div id="headline"></div>
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </main>
</div>

<div class="setup hidden" id="setup">
  <h2>Add your Firebase keys</h2>
  <p>Open this file in a text editor, find the <code>FIREBASE</code> block near the bottom, and paste in the config from your Firebase project. Everything else is ready to go.</p>
</div>

<div class="toast" id="toast"></div>

<!-- ══════════════════════════════════════════════════════════════
     FIREBASE CONFIG — paste yours here.
     Firebase console → Project settings → Your apps → Web app.
     Firestore only. No Authentication needed: people identify
     themselves by name, the same way The Ledger does.
     ══════════════════════════════════════════════════════════════ -->
<script>

<!-- Firebase lives in its own module so that if it fails to load — offline,
     opened straight off the disk, wrong keys — the interface below still
     runs and can say so, instead of the whole page going dead. -->
<script type="module">
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js");
    const fs = await import("https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js");
    const au = await import("https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js");
    const app = initializeApp(window.FIREBASE);
    window.FB = {
      db: fs.getFirestore(app),
      collection: fs.collection, doc: fs.doc, addDoc: fs.addDoc, updateDoc: fs.updateDoc,
      onSnapshot: fs.onSnapshot, runTransaction: fs.runTransaction,
      serverTimestamp: fs.serverTimestamp, arrayUnion: fs.arrayUnion,
      query: fs.query, orderBy: fs.orderBy,
      auth: au.getAuth(app),
      signIn: au.signInWithEmailAndPassword,
      signOut: au.signOut,
      onAuthStateChanged: au.onAuthStateChanged
    };
    window.dispatchEvent(new Event('fb-ready'));
  }catch(e){
    console.error('Firebase failed to load:', e);
    window.FB_ERROR = e;
    window.dispatchEvent(new Event('fb-failed'));
  }
</script>

<script>
const FIREBASE = window.FIREBASE;
let FB = null, db = null, leadsCol = null, fbReady = false;

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
const STATUS = {
  new:'Waiting', claimed:'Being called', call_back:'Call back',
  interested:'Interested', sold:'Sold', declined:'Not interested'
};
const OUTCOMES = [
  {k:'interested', label:'Interested',     tone:'good'},
  {k:'call_back',  label:'Call back',      tone:'warn'},
  {k:'sold',       label:'Sold',           tone:'good'},
  {k:'declined',   label:'Not interested', tone:'bad'}
];

let me = null;          // {role:'finder'|'closer', name}
let leads = [];
let ready = false;
let tab = null;
let unsub = null;
let pendingRole = null;
const openThreads = new Set();

const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => (s||'').replace(/\D/g,'');
const wa = p => digits(p) ? 'https://wa.me/' + digits(p) : '#';
// Names are typed, so match them loosely — "sara" and "Sara " are one person.
const norm = s => (s||'').trim().toLowerCase();

function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('up');
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.classList.remove('up'), 2600);
}
function ms(v){
  if(!v) return 0;
  if(typeof v === 'number') return v;
  if(v.toMillis) return v.toMillis();
  return 0;
}
function ago(v){
  const t = ms(v);
  if(!t) return 'just now';
  const s = Math.floor((Date.now()-t)/1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  const d = Math.floor(s/86400);
  if(d === 1) return 'yesterday';
  if(d < 7) return d + 'd ago';
  return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

/* ══════════════════════════════════════════════════════════════
   SESSION — a name and a role, remembered on this device
   ══════════════════════════════════════════════════════════════ */
function show(which){
  ['whoami','app'].forEach(id => $(id).classList.toggle('hidden', id !== which));
}
const forcedRole = 'finder';   // this file is the finder entrance

function greeting(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  return 'Good evening';
}

const ROLE_COPY = {
  finder: {
    heading: 'Who\u2019s finding today?',
    sub: 'Sign in with the account you were given. Your name goes on every venue you add.',
    foot: 'Three fields per venue: name, phone, address. Anything else you know goes in the notes, where the caller will read it.',
    cta: 'Sign in',
    line: 'The finders\u2019 entrance'
  },
  closer: {
    heading: 'Who\u2019s calling today?',
    sub: 'Sign in with the account you were given. Your name goes next to every lead you claim.',
    foot: 'Claim a venue before you ring it. That takes it off everyone else\u2019s pile so nobody gets called twice.',
    cta: 'Sign in',
    line: 'The callers\u2019 entrance'
  }
};

function paintDoor(){
  const finder = forcedRole === 'finder';
  const c = ROLE_COPY[forcedRole];
  pendingRole = forcedRole;

  $('doorFace').classList.toggle('c', !finder);
  $('doorGreet').textContent = greeting();
  $('doorN').textContent = c.line;
  $('doorN').classList.add('is-line');
  $('doorCap').textContent = '';
  $('doorFoot').textContent = c.foot;
  $('doorH').textContent = c.heading;
  $('whoamiSub').textContent = c.sub;

  const btn = $('doWhoami');
  btn.className = 'btn wide ' + (finder ? 'f' : 'c');
  btn.textContent = 'Sign in';

  show('whoami');
  setTimeout(()=>{ $('userInput').focus(); $('userInput').select(); }, 40);
}

function doorError(msg){
  const e = $('whoamiErr');
  e.textContent = msg;
  e.classList.remove('hidden');
}

// Firebase only understands email addresses, so an employee ID is quietly
// turned into one. Staff never see or type the domain.
const ID_DOMAIN = '@relay.local';
const ID_PREFIX = { finder:'SF', closer:'SC' }[forcedRole];
const idToEmail = id => id.trim().toLowerCase() + ID_DOMAIN;
const emailToId = em => (em || '').split('@')[0].toUpperCase();

async function signIn(){
  const id = $('userInput').value.trim().toUpperCase(), pw = $('pwInput').value;
  if(!id || !pw){ doorError('Fill in both fields.'); return; }
  if(!fbReady){ doorError('Still connecting \u2014 give it a second and try again.'); return; }

  // An ID from the other side is a wrong door, not a wrong password — say so.
  if(!id.startsWith(ID_PREFIX)){
    doorError(forcedRole === 'finder'
      ? 'That ID isn\u2019t for this site. Finder IDs start with SF.'
      : 'That ID isn\u2019t for this site. Caller IDs start with SC.');
    return;
  }

  $('whoamiErr').classList.add('hidden');
  const btn = $('doWhoami'); btn.disabled = true;
  try{
    await FB.signIn(FB.auth, idToEmail(id), pw);   // onAuthStateChanged takes it from here
  }catch(e){
    doorError(/invalid|wrong|not-found|credential/i.test(e.code || '')
      ? "That ID and password don\u2019t match an account."
      : "Couldn\u2019t sign in. Check your connection and try again.");
  }finally{
    btn.disabled = false;
  }
}


// Firebase remembers the session, so people sign in once per device.
function watchAuth(){
  FB.onAuthStateChanged(FB.auth, user => {
    if(!user){
      me = null; stop();
      $('pwInput').value = '';
      paintDoor();
      return;
    }
    $('pwInput').value = '';
    const id = emailToId(user.email);
    if(!id.startsWith(ID_PREFIX)){   // signed in on the other site in this browser
      FB.signOut(FB.auth);
      return;
    }
    me = { role:forcedRole, name:id, uid:user.uid };
    enter();
  });
}

$('doWhoami').onclick = signIn;
$('pwInput').addEventListener('keydown', e => { if(e.key === 'Enter') $('doWhoami').click(); });
$('userInput').addEventListener('keydown', e => { if(e.key === 'Enter') $('pwInput').focus(); });

$('leave').onclick = () => FB.signOut(FB.auth);   // onAuthStateChanged returns us to the door

function enter(){
  tab = me.role === 'finder' ? 'add' : 'pool';
  document.body.classList.toggle('c-role', me.role === 'closer');
  $('mark').innerHTML = `Relay <i>${me.role === 'finder' ? 'Finders' : 'Callers'}</i>`;
  $('who').innerHTML = `<span class="dot"></span><b>${esc(me.name)}</b>`;
  show('app');
  listen();
  draw();
}

/* ══════════════════════════════════════════════════════════════
   DATA — one document per lead, so two people saving at the same
   time can never overwrite each other's work.
   ══════════════════════════════════════════════════════════════ */
function listen(){
  stop();
  ready = false;
  if(!fbReady){ $('panel').innerHTML = skeleton(); return; }  // resumes on fb-ready
  unsub = FB.onSnapshot(FB.query(leadsCol, FB.orderBy('addedAt','desc')), snap => {
    leads = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    ready = true;
    draw();
  }, e => {
    console.error(e);
    toast("Lost the connection — changes may not be saving.");
  });
}
function stop(){ if(unsub){ unsub(); unsub = null; } leads = []; ready = false; openThreads.clear(); }

async function addLead(venue, phone, address){
  await FB.addDoc(leadsCol, {
    venue, phone, phoneDigits:digits(phone), address,
    status:'new',
    addedByName:me.name, addedAt:FB.serverTimestamp(),
    claimedByName:null, claimedAt:null,
    thread:[], updatedAt:FB.serverTimestamp()
  });
}

// Two closers hitting claim at the same moment: the transaction means
// exactly one wins and the other is told, instead of both thinking they
// own it and calling the same venue.
async function claim(id){
  try{
    const holder = await FB.runTransaction(db, async tx => {
      const ref = FB.doc(db, 'leads', id);
      const snap = await tx.get(ref);
      if(!snap.exists()) throw new Error('gone');
      const d = snap.data();
      if(d.status !== 'new') return d.claimedByName || 'someone else';
      tx.update(ref, {
        status:'claimed', claimedByName:me.name,
        claimedAt:FB.serverTimestamp(), updatedAt:FB.serverTimestamp()
      });
      return null;
    });
    if(holder){ toast(`${holder} got to that one first.`); return; }
    toast('Yours. It moved to your leads.');
    tab = 'mine'; draw();
  }catch(e){
    toast(e.message === 'gone' ? 'That lead was removed.' : "Couldn't claim it — try again.");
  }
}

async function release(id){
  await FB.updateDoc(FB.doc(db, 'leads', id), {
    status:'new', claimedByName:null, claimedAt:null, updatedAt:FB.serverTimestamp()
  });
  toast('Back on the pile for someone else.');
}

async function setOutcome(id, status){
  await FB.updateDoc(FB.doc(db, 'leads', id), { status, updatedAt:FB.serverTimestamp() });
}

async function post(id, text){
  await FB.updateDoc(FB.doc(db, 'leads', id), {
    thread: FB.arrayUnion({ author:me.name, role:me.role, text, at:Date.now() }),
    updatedAt: FB.serverTimestamp()
  });
}

/* ══════════════════════════════════════════════════════════════
   VIEWS
   ══════════════════════════════════════════════════════════════ */
const pool    = () => leads.filter(l => l.status === 'new');
const mineC   = () => leads.filter(l => l.status !== 'new' && norm(l.claimedByName) === norm(me.name));
const mineF   = () => leads.filter(l => norm(l.addedByName) === norm(me.name));
const working = () => leads.filter(l => l.status !== 'new');

function draw(){
  if(!me) return;
  drawHeadline();
  drawTabs();
  drawPanel();
}

function drawHeadline(){
  const h = $('headline');
  if(me.role === 'closer'){
    const n = pool().length;
    const mine = mineC().length;
    const sold = leads.filter(l => l.status === 'sold' && norm(l.claimedByName) === norm(me.name)).length;
    h.innerHTML = `<div class="headline">
      <span class="n c">${ready ? n : '\u2014'}</span>
      <span class="cap">${n === 1 ? 'venue waiting to be called' : 'venues waiting to be called'}</span>
      ${ready && (mine || sold) ? `<div class="side">
        <div><b>${mine}</b><small>With you</small></div>
        <div><b>${sold}</b><small>Sold</small></div>
      </div>` : ''}
    </div>`;
  }else{
    const my = mineF();
    const sold = my.filter(l => l.status === 'sold').length;
    const picked = my.filter(l => l.status !== 'new').length;
    h.innerHTML = `<div class="headline">
      <span class="n f">${ready ? my.length : '\u2014'}</span>
      <span class="cap">${my.length === 1 ? 'lead from you' : 'leads from you'}</span>
      ${ready && my.length ? `<div class="side">
        <div><b>${picked}</b><small>Picked up</small></div>
        <div><b>${sold}</b><small>Sold</small></div>
      </div>` : ''}
    </div>`;
  }
}

function drawTabs(){
  const defs = me.role === 'closer'
    ? [['pool','The pile',pool().length],['mine','My leads',mineC().length]]
    : [['add','Add a lead',null],['mine','My leads',mineF().length],['all','Everything',working().length]];
  $('tabs').innerHTML = defs.map(([k,label,n]) =>
    `<button class="tab ${tab===k?'on':''}" data-t="${k}">${label}${n===null?'':`<b>${ready?n:'–'}</b>`}</button>`
  ).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
}

function skeleton(n=3){
  return `<div class="list">${Array.from({length:n}).map((_,i)=>`
    <div class="sk-lead">
      <span class="sk" style="width:${44+i*9}%;height:17px;margin-bottom:11px"></span>
      <span class="sk" style="width:${26+i*5}%;height:12px;margin-bottom:16px"></span>
      <span class="sk" style="width:38%;height:36px;border-radius:9px"></span>
    </div>`).join('')}</div>`;
}

function renderPanel(){
  const p = $('panel');

  if(tab === 'add'){ p.innerHTML = addForm(); wireAddForm(); return; }
  if(!ready){ p.innerHTML = skeleton(); return; }

  let list, empty;
  if(tab === 'pool'){
    list = pool();
    empty = `<div class="empty"><div class="ring"></div><b>Nothing waiting</b><p>Every lead has been picked up. New ones appear here the moment someone adds them.</p></div>`;
  }else if(tab === 'all'){
    list = working();
    empty = `<div class="empty"><div class="ring"></div><b>Nothing being worked yet</b><p>Leads show up here once a caller picks them up.</p></div>`;
  }else if(me.role === 'closer'){
    list = mineC();
    empty = `<div class="empty"><div class="ring"></div><b>Nothing claimed yet</b><p>Open the pile and take the one at the top.</p></div>`;
  }else{
    list = mineF();
    empty = `<div class="empty"><div class="ring"></div><b>Nothing from you yet</b><p>Add your first venue and it lands on the pile straight away.</p></div>`;
  }

  list = list.slice().sort((a,b) => ms(b.updatedAt) - ms(a.updatedAt));
  p.innerHTML = list.length ? `<div class="list">${list.map(card).join('')}</div>` : empty;
  wireCards();
}

// A live update from someone else shouldn't wipe out text being typed.
function drawPanel(){
  const a = document.activeElement;
  if(a && a.tagName === 'TEXTAREA' && a.id.startsWith('say-')) return;
  if(tab === 'add' && a && a.tagName === 'INPUT' && ['fVenue','fPhone','fAddr'].includes(a.id)) return;
  renderPanel();
}

/* ── add form ── */
function addForm(){
  return `<div class="card">
    <h2>New lead</h2>
    <p class="note">Three fields. It lands on the pile straight away.</p>
    <div id="dupe"></div>
    <div class="field">
      <label class="lab" for="fVenue">Venue name</label>
      <input type="text" id="fVenue" placeholder="e.g. Cantina do Tejo" autocomplete="off">
    </div>
    <div class="field">
      <label class="lab" for="fPhone">Phone number</label>
      <input type="tel" id="fPhone" placeholder="+351 912 345 678" autocomplete="off">
    </div>
    <div class="field">
      <label class="lab" for="fAddr">Address <span class="opt">— optional</span></label>
      <input type="text" id="fAddr" placeholder="Street, area" autocomplete="off">
    </div>
    <p class="err hidden" id="fErr"></p>
    <button class="btn f wide" id="fSave">Add to the pile</button>
  </div>`;
}

function wireAddForm(){
  const venue = $('fVenue'), phone = $('fPhone'), addr = $('fAddr'), err = $('fErr'), btn = $('fSave');

  // Flag a number that's already here while they type, not after they save.
  phone.addEventListener('input', () => {
    const d = digits(phone.value);
    const box = $('dupe');
    if(d.length < 7){ box.innerHTML = ''; return; }
    const hit = leads.find(l => l.phoneDigits === d);
    box.innerHTML = hit ? `<div class="warn-box">
      <b>${esc(hit.venue)} is already here</b>
      <p>Added by ${esc(hit.addedByName)} ${ago(hit.addedAt)} — ${esc(STATUS[hit.status] || hit.status)}${hit.claimedByName ? `, with ${esc(hit.claimedByName)}` : ''}.</p>
    </div>` : '';
  });

  [venue, phone, addr].forEach(el => el.addEventListener('keydown', e => { if(e.key === 'Enter') btn.click(); }));

  btn.onclick = async () => {
    const v = venue.value.trim(), p = phone.value.trim(), a = addr.value.trim();
    if(!v){ err.textContent = 'Give the venue a name.'; err.classList.remove('hidden'); venue.focus(); return; }
    if(digits(p).length < 7){ err.textContent = 'A working phone number is the whole point — add one.'; err.classList.remove('hidden'); phone.focus(); return; }
    if(leads.some(l => l.phoneDigits === digits(p))){
      err.textContent = 'That number is already on the pile.'; err.classList.remove('hidden'); return;
    }
    err.classList.add('hidden');
    btn.disabled = true;
    try{
      await addLead(v, p, a);
      venue.value = ''; phone.value = ''; addr.value = '';
      $('dupe').innerHTML = '';
      venue.focus();
      toast(`${v} is on the pile.`);
    }catch(e){
      console.error(e);
      err.textContent = "Couldn't save it. Check your connection and try again.";
      err.classList.remove('hidden');
    }finally{
      btn.disabled = false;
    }
  };
  venue.focus();
}

/* ── lead card ── */
function card(l){
  const isMineC = me.role === 'closer' && norm(l.claimedByName) === norm(me.name);
  const isMineF = me.role === 'finder' && norm(l.addedByName) === norm(me.name);
  const canTalk = isMineC || isMineF;
  const open = openThreads.has(l.id);
  const n = (l.thread || []).length;

  const foot = [`Found by <b>${esc(l.addedByName)}</b> \u00b7 ${ago(l.addedAt)}`];
  if(l.claimedByName){
    foot.push(`${isMineC ? 'With <b>you</b>' : 'With <b>' + esc(l.claimedByName) + '</b>'} \u00b7 ${ago(l.claimedAt)}`);
  }

  let actions = '';
  if(me.role === 'closer' && l.status === 'new'){
    actions = `<button class="btn c sm" data-act="claim" data-id="${l.id}">Claim and call</button>`;
  }else if(isMineC){
    actions = `<button class="btn quiet sm" data-act="release" data-id="${l.id}">Put it back</button>`;
  }

  const outcomes = isMineC ? `<div class="outcomes">${OUTCOMES.map(o =>
    `<button class="oc ${o.tone} ${l.status===o.k?'on':''}" data-act="oc" data-id="${l.id}" data-k="${o.k}">${o.label}</button>`
  ).join('')}</div>` : '';

  const threadBtn = (n || canTalk)
    ? `<button class="btn quiet sm" data-act="thread" data-id="${l.id}">${open ? 'Hide notes' : (n ? `Notes (${n})` : 'Add a note')}</button>`
    : '';

  return `<article class="lead s-${l.status}">
    <div class="lead-head">
      <div class="lead-title">
        <div class="lead-name">${esc(l.venue)}</div>
        ${l.address ? `<div class="lead-where">${esc(l.address)}</div>` : ''}
      </div>
      <span class="pin ${l.status}">${esc(STATUS[l.status] || l.status)}</span>
    </div>
    <a class="lead-tel" href="${wa(l.phone)}" target="_blank" rel="noopener">${esc(l.phone)}</a>
    ${outcomes}
    ${(actions || threadBtn) ? `<div class="lead-actions">${actions}${threadBtn}</div>` : ''}
    ${open ? thread(l, canTalk) : ''}
    <div class="lead-foot">${foot.map(f => `<span>${f}</span>`).join('')}</div>
  </article>`;
}

function thread(l, canTalk){
  const msgs = (l.thread || []).slice().sort((a,b) => (a.at||0) - (b.at||0));
  const body = msgs.length ? msgs.map(m => `<div class="msg">
      <div class="from ${m.role === 'finder' ? 'f' : 'c'}">${esc(m.author)}<span class="when">${ago(m.at)}</span></div>
      <div class="txt">${esc(m.text)}</div>
    </div>`).join('')
    : `<div class="msg"><div class="txt">No notes yet.</div></div>`;

  const box = canTalk ? `<div class="say">
      <textarea id="say-${l.id}" rows="1" placeholder="${me.role === 'finder' ? 'Anything the caller should know?' : 'What happened on the call?'}"></textarea>
      <button class="btn solid sm" data-act="post" data-id="${l.id}">Post</button>
    </div>` : '';

  return `<div class="thread">${body}${box}</div>`;
}

function wireCards(){
  $('panel').querySelectorAll('[data-act]').forEach(b => {
    const id = b.dataset.id;
    b.onclick = async () => {
      const act = b.dataset.act;
      if(act === 'claim'){ b.disabled = true; await claim(id); }
      else if(act === 'release'){ b.disabled = true; await release(id); }
      else if(act === 'oc'){ await setOutcome(id, b.dataset.k); }
      else if(act === 'thread'){
        openThreads.has(id) ? openThreads.delete(id) : openThreads.add(id);
        renderPanel();
        const ta = $('say-' + id); if(ta) ta.focus();
      }
      else if(act === 'post'){
        const ta = $('say-' + id);
        const text = ta.value.trim();
        if(!text) return;
        b.disabled = true;
        try{ await post(id, text); ta.value = ''; }
        catch(e){ toast("Couldn't post that note."); }
        finally{ b.disabled = false; }
      }
    };
  });
  $('panel').querySelectorAll('.say textarea').forEach(ta => {
    ta.addEventListener('keydown', e => {
      if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
        e.preventDefault();
        ta.closest('.say').querySelector('[data-act="post"]').click();
      }
    });
  });
}

/* ══════════════════════════════════════════════════════════════
   STARTUP — the gate works immediately; the pile waits for Firebase
   ══════════════════════════════════════════════════════════════ */
function fbProblem(msg){
  $('whoami').classList.add('hidden');
  $('app').classList.add('hidden');
  const box = $('setup');
  box.classList.remove('hidden');
  box.innerHTML = msg;
}

window.addEventListener('fb-ready', () => {
  FB = window.FB;
  db = FB.db;
  leadsCol = FB.collection(db, 'leads');
  fbReady = true;
  watchAuth();
});

window.addEventListener('fb-failed', () => {
  fbProblem(`<h2>Can't reach Firebase</h2>
